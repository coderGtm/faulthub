services:
  faulthub:
    build: .
    restart: unless-stopped
    ports:
      - "${FAULTHUB_PORT:-8080}:${FAULTHUB_PORT:-8080}"
    environment:
      FAULTHUB_ADDR: :${FAULTHUB_PORT:-8080}
      FAULTHUB_ADMIN_PASSWORD_HASH: ${FAULTHUB_ADMIN_PASSWORD_HASH:?set in .env}
      FAULTHUB_INGEST_RATE_PER_MIN: ${FAULTHUB_INGEST_RATE_PER_MIN:-30}
      FAULTHUB_INGEST_BURST: ${FAULTHUB_INGEST_BURST:-10}
      FAULTHUB_LOGIN_RATE_PER_MIN: ${FAULTHUB_LOGIN_RATE_PER_MIN:-5}
      FAULTHUB_MAX_BODY_BYTES: ${FAULTHUB_MAX_BODY_BYTES:-1048576}
      FAULTHUB_TRUST_PROXY: ${FAULTHUB_TRUST_PROXY:-true}
      FAULTHUB_COOKIE_SECURE: ${FAULTHUB_COOKIE_SECURE:-true}
      FAULTHUB_SESSION_TTL: ${FAULTHUB_SESSION_TTL:-168h}
    volumes:
      - faulthub-data:/data

volumes:
  faulthub-data: