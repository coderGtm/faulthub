<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · FaultHub</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
<div class="topbar-inner">
	<a class="brand" href="/">FaultHub</a>
	{{if .Authed}}
	<nav>
		<a href="/">Overview</a>
		<a href="/apps">Apps</a>
	</nav>
	{{end}}
	<div class="topbar-actions">
		<button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme">
			<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
			<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
		</button>
		{{if .Authed}}
		<form method="post" action="/logout">
			<input type="hidden" name="csrf" value="{{.CSRF}}">
			<button class="btn-ghost" type="submit">Log out</button>
		</form>
		{{end}}
	</div>
</div>
</header>
<main class="container">
{{template "content" .}}
</main>
<footer class="footer">
	<span>Your crashes, your server.</span>
	<span>{{.Title}}</span>
</footer>
<script src="/static/app.js"></script>
</body>
</html>
